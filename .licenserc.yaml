header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: alibaba

  paths-ignore:
    - '.gitignore'
    - '*.md'
    - '*.yml'
    - '*.yaml'
    - '*.golden'
    - 'LICENSE'
    - 'api/**'
    - 'samples/**'
    - 'docs/**'
    - '.github/**'
    - '.licenserc.yaml'
    - 'helm/**'
    # Helm helper templates use Go-template comments, while license-eye treats
    # generic .tpl files as Smarty templates and would generate invalid syntax.
    - 'deploy/ack/**/_helpers.tpl'
    # Generated operational evidence is JSON data, not source code.
    - 'deploy/ack/evidence/**'
    # Grafana dashboard JSON cannot contain a source-code license comment.
    - 'deploy/ack/charts/higress-ack-ops/dashboards/**'
    - 'envoy/**'
    - 'istio/**'
    - 'go.mod'
    - 'go.sum'
    - 'docker/**'
    - 'Makefile*'
    - 'script/**'
    - '.gitmodules'
    - 'plugins/**'
    - 'CODEOWNERS'
    - 'VERSION'
    - 'DEP_VERSION'
    - 'tools/'
    - 'test/README.md'
    - 'test/README_CN.md'
    - 'test/gateway/reports/**'
    - 'test/inference-extension/reports/**'
    - 'hgctl/cmd/hgctl/config/testdata/config'
    - 'hgctl/pkg/manifests'
    - 'pkg/ingress/kube/gateway/istio/testdata'
    - 'release-notes/**'
    - '.cursor/**'
    - '.claude/**'
    - '.agents/**'
    - '.issue-spec/**'
    - 'issue-spec/**'

  comment: on-failure
dependency:
  files:
    - go.mod
