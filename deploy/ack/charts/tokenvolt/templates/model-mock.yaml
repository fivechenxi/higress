{{- if .Values.modelApi.mock.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.modelApi.backendService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tokenvolt-model-mock
    {{- include "tokenvolt.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: tokenvolt-model-mock
  ports:
    - name: http
      port: {{ .Values.modelApi.backendService.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenvolt-model-mock
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tokenvolt-model-mock
    {{- include "tokenvolt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.modelApi.mock.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tokenvolt-model-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tokenvolt-model-mock
        {{- include "tokenvolt.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openai-fixture
          image: {{ required "modelApi.mock.image must be an immutable image when mock is enabled" .Values.modelApi.mock.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.modelApi.mock.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: {drop: [ALL]}
{{- end }}
