apiVersion: v1
kind: Service
metadata:
  name: tokenvolt-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tokenvolt.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tokenvolt.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenvolt-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tokenvolt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      {{- include "tokenvolt.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if .Values.higress.gatewayConfigPublisher.enabled }}
    # Do not overlap a legacy publisher with the serialized publication worker.
    type: Recreate
    {{- else }}
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "tokenvolt.selectorLabels" . | nindent 8 }}
        {{- include "tokenvolt.labels" . | nindent 8 }}
      {{- if .Values.controlPlane.metrics.metricsSecretName }}
      annotations:
        checksum/metrics-token: {{ required "controlPlane.metrics.tokenRevision must be set when metricsSecretName is set" .Values.controlPlane.metrics.tokenRevision | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.controlPlane.serviceAccountName }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-plane
          image: {{ required "controlPlane.image must be an immutable VPC-reachable image" .Values.controlPlane.image | quote }}
          imagePullPolicy: {{ .Values.controlPlane.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.controlPlane.databaseSecretName }}, key: url}}
            - name: TOTP_MASTER_KEY_B64
              valueFrom: {secretKeyRef: {name: {{ .Values.controlPlane.appSecretName }}, key: totpMasterKeyB64}}
            - name: API_KEY_PEPPER_B64
              valueFrom: {secretKeyRef: {name: {{ .Values.controlPlane.appSecretName }}, key: apiKeyPepperB64}}
            - {name: SLS_REGION_ID, value: {{ required "controlPlane.cloud.slsRegionId must be set" .Values.controlPlane.cloud.slsRegionId | quote }}}
            - {name: SLS_ENDPOINT, value: {{ required "controlPlane.cloud.slsEndpoint must be set" .Values.controlPlane.cloud.slsEndpoint | quote }}}
            - {name: SLS_PROJECT, value: {{ required "controlPlane.cloud.slsProject must be set" .Values.controlPlane.cloud.slsProject | quote }}}
            - {name: SLS_LOGSTORE, value: {{ required "controlPlane.cloud.slsLogstore must be set" .Values.controlPlane.cloud.slsLogstore | quote }}}
            - {name: USAGE_BINDING_PROVIDER, value: "higress"}
            {{- if .Values.controlPlane.archive.producerEnabled }}
            {{- if not .Values.controlPlane.archive.derivedEnabled }}{{ fail "archive producer requires derived workers" }}{{ end }}
            {{- if not .Values.controlPlane.archive.reconcileEnabled }}{{ fail "archive producer requires snapshot reconciler" }}{{ end }}
            - {name: USAGE_ARCHIVE_PRODUCER_ENABLED, value: "true"}
            - {name: USAGE_ARCHIVE_SOURCE_ID, value: {{ required "controlPlane.archive.sourceId is required" .Values.controlPlane.archive.sourceId | quote }}}
            - {name: USAGE_ARCHIVE_ENVIRONMENT_ID, value: {{ required "controlPlane.archive.environmentId is required" .Values.controlPlane.archive.environmentId | quote }}}
            - {name: USAGE_ARCHIVE_START_CURSORS, value: {{ required "controlPlane.archive.startCursors is required" .Values.controlPlane.archive.startCursors | toJson | quote }}}
            {{- end }}
            {{- if .Values.controlPlane.archive.derivedEnabled }}
            - {name: USAGE_ARCHIVE_DERIVED_ENABLED, value: "true"}
            - {name: USAGE_ARCHIVE_SOURCE_ENVIRONMENTS, value: {{ required "controlPlane.archive.sourceEnvironments is required" .Values.controlPlane.archive.sourceEnvironments | toJson | quote }}}
            - {name: USAGE_ARCHIVE_PREFIX, value: {{ required "controlPlane.archive.prefix is required" .Values.controlPlane.archive.prefix | quote }}}
            {{- end }}
            {{- if .Values.controlPlane.archive.reconcileEnabled }}
            - {name: USAGE_ARCHIVE_RECONCILE_ENABLED, value: "true"}
            {{- end }}
            - {name: HIGRESS_QUOTA_ENABLED, value: {{ .Values.controlPlane.quotaEnabled | quote }}}
            {{- if or .Values.controlPlane.usageDashboard.environment .Values.controlPlane.usageDashboard.source }}
            - {name: USAGE_DASHBOARD_ENVIRONMENT, value: {{ required "controlPlane.usageDashboard.environment must be set with source" .Values.controlPlane.usageDashboard.environment | quote }}}
            - {name: USAGE_DASHBOARD_SOURCE, value: {{ required "controlPlane.usageDashboard.source must be set with environment" .Values.controlPlane.usageDashboard.source | quote }}}
            {{- end }}
            - {name: OSS_REGION_ID, value: {{ required "controlPlane.cloud.ossRegionId must be set" .Values.controlPlane.cloud.ossRegionId | quote }}}
            - {name: OSS_ENDPOINT, value: {{ required "controlPlane.cloud.ossEndpoint must be set" .Values.controlPlane.cloud.ossEndpoint | quote }}}
            - {name: OSS_BUCKET, value: {{ required "controlPlane.cloud.ossBucket must be set" .Values.controlPlane.cloud.ossBucket | quote }}}
            - {name: CREDENTIAL_PROVIDER, value: higress}
            - {name: ALLOWED_ORIGIN, value: {{ default (printf "https://%s" .Values.portal.host) .Values.controlPlane.allowedOrigin | quote }}}
            - {name: ALLOW_INSECURE_SESSION_COOKIE, value: {{ .Values.controlPlane.allowInsecureSessionCookie | quote }}}
            - {name: LISTEN_ADDR, value: ":8000"}
            {{- if .Values.controlPlane.metrics.metricsSecretName }}
            - {name: METRICS_TOKEN_FILE, value: "/etc/tokenvolt/metrics/token"}
            {{- end }}
            - {name: HIGRESS_KUBE_API, value: "https://kubernetes.default.svc"}
            - {name: HIGRESS_KUBE_TOKEN_FILE, value: "/var/run/secrets/kubernetes.io/serviceaccount/token"}
            - {name: HIGRESS_KUBE_CA_FILE, value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"}
            - {name: HIGRESS_NAMESPACE, value: {{ .Values.higress.namespace | quote }}}
            - {name: HIGRESS_POLICY_NAME, value: {{ .Values.higress.policyName | quote }}}
            - {name: HIGRESS_POLICY_PLUGIN_URL, value: {{ required "higress.policyPluginUrl must be an immutable OCI digest URL" .Values.higress.policyPluginUrl | quote }}}
            - {name: HIGRESS_POLICY_PLUGIN_SHA256, value: {{ .Values.higress.policyPluginSha256 | quote }}}
            - {name: HIGRESS_POLICY_IMAGE_PULL_SECRET, value: {{ .Values.higress.imagePullSecret | quote }}}
            - {name: HIGRESS_POLICY_INGRESS, value: {{ .Values.higress.policyIngress | quote }}}
            {{- if .Values.higress.gatewayConfigPublisher.enabled }}
            - {name: HIGRESS_ROUTE_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: HIGRESS_MODEL_HOST, value: {{ .Values.modelApi.host | quote }}}
            - {name: HIGRESS_PUBLIC_HOST, value: {{ .Values.publicEntry.host | quote }}}
            - {name: HIGRESS_AI_PROXY_NAME, value: {{ .Values.higress.gatewayConfigPublisher.aiProxyName | quote }}}
            - {name: HIGRESS_AI_PROXY_PLUGIN_URL, value: {{ required "modelRouting.aiProxy.url must be set for the gateway config publisher" .Values.modelRouting.aiProxy.url | quote }}}
            - {name: HIGRESS_AI_PROXY_PLUGIN_SHA256, value: {{ required "modelRouting.aiProxy.sha256 must be set for the gateway config publisher" .Values.modelRouting.aiProxy.sha256 | quote }}}
            - {name: HIGRESS_AI_PROXY_IMAGE_PULL_SECRET, value: {{ .Values.higress.imagePullSecret | quote }}}
            {{- if .Values.modelRouting.useRealBackends }}
            - {name: HIGRESS_GATEWAY_BOOTSTRAP_FILE, value: "/etc/tokenvolt/gateway-bootstrap/bootstrap.json"}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            capabilities: {drop: [ALL]}
          {{- if or .Values.controlPlane.metrics.metricsSecretName (and .Values.higress.gatewayConfigPublisher.enabled .Values.modelRouting.useRealBackends) }}
          volumeMounts:
            {{- if and .Values.higress.gatewayConfigPublisher.enabled .Values.modelRouting.useRealBackends }}
            - {name: gateway-bootstrap, mountPath: /etc/tokenvolt/gateway-bootstrap, readOnly: true}
            - {name: provider-credentials, mountPath: /var/run/tokenvolt/provider-credentials, readOnly: true}
            {{- end }}
            {{- if .Values.controlPlane.metrics.metricsSecretName }}
            - {name: controlplane-metrics, mountPath: /etc/tokenvolt/metrics, readOnly: true}
            {{- end }}
          {{- end }}
      {{- if or .Values.controlPlane.metrics.metricsSecretName (and .Values.higress.gatewayConfigPublisher.enabled .Values.modelRouting.useRealBackends) }}
      volumes:
        {{- if and .Values.higress.gatewayConfigPublisher.enabled .Values.modelRouting.useRealBackends }}
        - name: gateway-bootstrap
          configMap: {name: tokenvolt-gateway-bootstrap}
        - name: provider-credentials
          secret: {secretName: {{ .Values.modelRouting.credentialSecretName }}}
        {{- end }}
        {{- if .Values.controlPlane.metrics.metricsSecretName }}
        - name: controlplane-metrics
          secret:
            secretName: {{ .Values.controlPlane.metrics.metricsSecretName | quote }}
            items:
              - key: {{ .Values.controlPlane.metrics.metricsTokenKey | quote }}
                path: token
        {{- end }}
      {{- end }}

{{- if .Values.controlPlane.publicService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: tokenvolt-control-plane-public
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tokenvolt.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.controlPlane.publicService.annotations | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
    {{- include "tokenvolt.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
