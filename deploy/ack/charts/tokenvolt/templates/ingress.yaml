{{- if not .Values.portal.directEntry }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tokenvolt-portal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tokenvolt.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.higress.ingressClassName }}
  {{- if and .Values.publicEntry.host .Values.publicEntry.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.publicEntry.host | quote }}]
      secretName: {{ .Values.publicEntry.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.portal.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tokenvolt-control-plane
                port: {number: 8000}
    {{- with .Values.publicEntry.host }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tokenvolt-control-plane
                port: {number: 8000}
    {{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tokenvolt-model-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tokenvolt.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.higress.ingressClassName }}
  {{- if and .Values.publicEntry.host .Values.publicEntry.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.publicEntry.host | quote }}]
      secretName: {{ .Values.publicEntry.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.modelApi.host }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.modelApi.backendService.name }}
                port: {number: {{ .Values.modelApi.backendService.port }}}
    {{- with .Values.publicEntry.host }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.modelApi.backendService.name }}
                port: {number: {{ $.Values.modelApi.backendService.port }}}
    {{- end }}
