{{- if .Values.higress.rateLimits.enabled }}
{{- $domains := required "higress.rateLimits.domains must be set" .Values.higress.rateLimits.domains }}
{{- $redis := .Values.higress.rateLimits.redis }}
{{- $plugins := list
      (dict "name" "tokenvolt-customer-rate-limit" "artifact" .Values.higress.rateLimits.requestPlugin "priority" 610 "quotaHeaders" true)
      (dict "name" "tokenvolt-trial-token-quota" "artifact" .Values.higress.rateLimits.tokenPlugin "priority" 620 "quotaHeaders" false)
      (dict "name" "tokenvolt-postpaid-token-quota" "artifact" .Values.higress.rateLimits.tokenPlugin "priority" 620 "quotaHeaders" false)
      (dict "name" "tokenvolt-customer-token-rate-limit" "artifact" .Values.higress.rateLimits.tokenPlugin "priority" 615 "quotaHeaders" false "rejectedMsg" "{\"error\":{\"message\":\"Customer token rate limit exceeded\",\"type\":\"rate_limit_error\",\"code\":\"rate_limit_exceeded\"}}")
}}
{{- range $index, $plugin := $plugins }}
{{- $existing := lookup "extensions.higress.io/v1alpha1" "WasmPlugin" $.Values.higress.namespace $plugin.name }}
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: {{ $plugin.name }}
  namespace: {{ $.Values.higress.namespace }}
  labels:
    tokenvolt.ai/managed: rate-limit
    {{- include "tokenvolt.labels" $ | nindent 4 }}
  annotations:
    tokenvolt.ai/rate-limit-domains: {{ $domains | toJson | quote }}
spec:
  url: {{ required (printf "artifact URL is required for %s" $plugin.name) $plugin.artifact.url | quote }}
  sha256: {{ required (printf "artifact sha256 is required for %s" $plugin.name) $plugin.artifact.sha256 | quote }}
  {{- if hasPrefix "oci://" $plugin.artifact.url }}
  imagePullSecret: {{ $.Values.higress.imagePullSecret | quote }}
  {{- end }}
  imagePullPolicy: IfNotPresent
  phase: UNSPECIFIED_PHASE
  priority: {{ $plugin.priority }}
  defaultConfigDisable: true
  defaultConfig:
    redis:
      service_name: {{ required "higress.rateLimits.redis.serviceName must be set" $redis.serviceName | quote }}
      service_port: {{ $redis.servicePort }}
      {{- with $redis.username }}
      username: {{ . | quote }}
      {{- end }}
      {{- with $redis.password }}
      password: {{ . | quote }}
      {{- end }}
      timeout: 1000
    rejected_code: 429
    rejected_msg: {{ default "TokenVolt rate limit exceeded" $plugin.rejectedMsg | quote }}
    {{- if $plugin.quotaHeaders }}
    show_limit_quota_header: true
    {{- end }}
  matchRules:
    {{- if and $existing $existing.spec.matchRules }}
    {{- toYaml $existing.spec.matchRules | nindent 4 }}
    {{- else }} []
    {{- end }}
---
{{- end }}
{{- end }}
