apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controlPlane.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tokenvolt.labels" . | nindent 4 }}
  annotations:
    pod-identity.alibabacloud.com/role-name: {{ required "controlPlane.rrsaRoleName must be set" .Values.controlPlane.rrsaRoleName | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tokenvolt-policy-publisher
  namespace: {{ .Values.higress.namespace }}
  labels:
    {{- include "tokenvolt.labels" . | nindent 4 }}
rules:
  - apiGroups: ["extensions.higress.io"]
    resources: ["wasmplugins"]
    verbs: ["get", "create", "update"]
  {{- if .Values.higress.gatewayConfigPublisher.enabled }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # ACK authorizes the upgraded exec connection with create as well as get.
    verbs: ["get", "create"]
  - apiGroups: ["networking.istio.io"]
    resources: ["envoyfilters"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: ["networking.higress.io"]
    resources: ["mcpbridges"]
    verbs: ["get", "create", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tokenvolt-policy-publisher
  namespace: {{ .Values.higress.namespace }}
  labels:
    {{- include "tokenvolt.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controlPlane.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tokenvolt-policy-publisher
{{- if .Values.higress.gatewayConfigPublisher.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tokenvolt-gateway-route-publisher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tokenvolt.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tokenvolt-gateway-route-publisher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tokenvolt.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controlPlane.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tokenvolt-gateway-route-publisher
{{- end }}
