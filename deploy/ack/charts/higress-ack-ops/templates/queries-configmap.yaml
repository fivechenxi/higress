apiVersion: v1
kind: ConfigMap
metadata:
  name: higress-ack-promql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "higress-ack-ops.labels" . | nindent 4 }}
data:
  # Canonical recording rules retain ai_route, ai_model and ai_provider. Sum or
  # filter those labels for gateway-wide, model or provider drill-down.
  ai-rpm: 'tokenvolt:ai_rpm:rate5m'
  ai-error-ratio: 'tokenvolt:ai_failures_per_second:rate5m / clamp_min(tokenvolt:ai_requests_per_second:rate5m, 0.000001)'
  ai-abort-ratio: 'tokenvolt:ai_aborts_per_second:rate5m / clamp_min(tokenvolt:ai_requests_per_second:rate5m, 0.000001)'
  ai-ttft-p50-ms: 'tokenvolt:ai_ttft_milliseconds:p50_rate5m'
  ai-ttft-p90-ms: 'tokenvolt:ai_ttft_milliseconds:p90_rate5m'
  ai-tpot-p50-ms: 'tokenvolt:ai_tpot_milliseconds:p50_rate5m'
  ai-tpot-p90-ms: 'tokenvolt:ai_tpot_milliseconds:p90_rate5m'
  ai-average-service-duration-ms: 'tokenvolt:ai_service_duration_milliseconds:avg_rate5m'
  ai-input-tpm: 'tokenvolt:ai_input_tpm:rate5m'
  ai-output-tpm: 'tokenvolt:ai_output_tpm:rate5m'
  ai-total-tpm: 'tokenvolt:ai_total_tpm:rate5m'
  ai-cache-hit-tpm: 'tokenvolt:ai_cache_hit_tpm:rate5m'
  ai-cache-token-hit-ratio: 'tokenvolt:ai_cache_token_hit_ratio:rate5m'
  ai-cache-request-hit-ratio: 'tokenvolt:ai_cache_request_hit_ratio:rate5m'
  ai-cache-reporting-ratio: 'tokenvolt:ai_cache_reporting_ratio:rate5m'
  ai-inflight: 'tokenvolt:ai_inflight_requests'
  provider-attempt-rpm: 'tokenvolt:provider_attempt_rpm:rate5m'
  provider-429-rpm: 'tokenvolt:provider_429_rpm:rate5m'
  provider-5xx-rpm: 'tokenvolt:provider_5xx_rpm:rate5m'
  provider-model-success-ratio: 'tokenvolt:provider_model_success_ratio:rate5m'
  provider-model-rpm: 'tokenvolt:provider_model_logical_rpm:rate5m'
  provider-model-rpm-limit: 'tokenvolt:provider_model_rpm_limit'
  provider-model-tpm: 'tokenvolt:provider_model_total_tpm:rate5m'
  provider-model-tpm-limit: 'tokenvolt:provider_model_tpm_limit'
  provider-model-ttft-p90-ms: 'tokenvolt:provider_model_ttft_milliseconds:p90_rate5m'
  provider-model-tpot-p90-ms: 'tokenvolt:provider_model_tpot_milliseconds:p90_rate5m'
  provider-attempt-amplification: 'tokenvolt:provider_attempts_per_logical_request:rate5m'
  gateway-active-streams-by-pod: 'tokenvolt:gateway_active_streams'
  gateway-active-streams-total: 'tokenvolt:gateway_active_streams:sum'
  gateway-ready-targets: 'tokenvolt:gateway_ready_targets:count'
  gateway-upstream-pending: 'tokenvolt:gateway_upstream_pending_requests:sum'
  hpa-current-replicas: 'tokenvolt:hpa_current_replicas'
  hpa-desired-replicas: 'tokenvolt:hpa_desired_replicas'
  hpa-current-metric: 'tokenvolt:hpa_current_metric'
  hpa-target-metric: 'tokenvolt:hpa_target_metric'
  customer-rpm-utilization: 'tokenvolt_customer_rpm_utilization'
  trial-key-quota-unavailable: 'tokenvolt_trial_key_quota_unavailable'
  postpaid-token-quota-exhausted: 'tokenvolt_postpaid_tenant_token_quota_exhausted'
  prometheus-adapter-down: 'absent(up{job="prometheus-adapter"} == 1)'
  terway-ct-pressure: 'tokenvolt:terway_ct_pressure:max'
  terway-map-update-failures: 'tokenvolt:terway_map_update_failures_per_second:rate5m'
