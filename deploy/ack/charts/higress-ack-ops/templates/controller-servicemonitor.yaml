{{- if and .Values.monitoring.enabled .Values.monitoring.discoveryObjectsEnabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: higress-controller
  namespace: {{ .Release.Namespace }}
  annotations:
    arms.prometheus.io/discovery: {{ .Values.monitoring.discoveryAnnotation | quote }}
  labels:
    {{- include "higress-ack-ops.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.monitoring.controller.namespace }}
  selector:
    matchLabels:
      {{- toYaml .Values.monitoring.controller.selector | nindent 6 }}
  endpoints:
    - port: {{ .Values.monitoring.controller.port }}
      path: {{ .Values.monitoring.controller.path }}
      interval: {{ .Values.monitoring.interval }}
      metricRelabelings:
        - sourceLabels: [__name__]
          action: keep
          regex: '^(pilot_(xds|xds_expired_nonce|endpoint_not_ready|eds_no_instances)|pilot_(xds_push_time|proxy_convergence_time)(_bucket|_sum|_count))$'
{{- end }}
