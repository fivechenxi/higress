{{- if and .Values.monitoring.enabled (or .Values.monitoring.grafana.dashboardsEnabled .Values.monitoring.grafana.enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: higress-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    {{- include "higress-ack-ops.labels" . | nindent 4 }}
data:
  tokenvolt-higress-ai-gateway.json: |-
{{ .Files.Get "dashboards/tokenvolt-higress-ai-gateway.json" | indent 4 }}
{{- end }}
