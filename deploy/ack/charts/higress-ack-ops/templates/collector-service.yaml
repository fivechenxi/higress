{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: higress-metrics-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "higress-ack-ops.labels" . | nindent 4 }}
spec:
  selector:
    app: higress-metrics-collector
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- end }}
