{{- if .Values.monitoring.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: higress-metrics-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app: higress-metrics-collector
    {{- include "higress-ack-ops.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: higress-metrics-collector
  template:
    metadata:
      labels:
        app: higress-metrics-collector
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/collector-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: higress-metrics-collector
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.collector.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
            - --storage.tsdb.retention.size=384MB
            - --web.listen-address=:9090
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.monitoring.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
        {{- if .Values.monitoring.quotaMetrics.enabled }}
        - name: quota-metrics
          image: {{ .Values.monitoring.quotaMetrics.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [python3, /opt/quota-metrics/exporter.py]
          env:
            - {name: HIGRESS_NAMESPACE, value: {{ .Values.monitoring.quotaMetrics.higressNamespace | quote }}}
            - {name: REDIS_HOST, value: {{ .Values.monitoring.quotaMetrics.redisHost | quote }}}
            - {name: REDIS_PORT, value: {{ .Values.monitoring.quotaMetrics.redisPort | quote }}}
          ports:
            - {name: quota-metrics, containerPort: 9109}
          readinessProbe:
            httpGet: {path: /healthz, port: quota-metrics}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.monitoring.quotaMetrics.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /opt/quota-metrics/exporter.py
              subPath: quota-exporter.py
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: higress-metrics-collector
        - name: data
          emptyDir:
            sizeLimit: 512Mi
{{- end }}
