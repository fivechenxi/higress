autoscaling:
  gateway:
    minReplicas: 2
    maxReplicas: 4
    activeStreams:
      enabled: true
      averageValue: "225"
  controller:
    minReplicas: 2
    maxReplicas: 3
    cpuUtilization: 65
  scaleDownStabilizationSeconds: 300

prometheusAdapter:
  enabled: true
  # Beijing workers cannot reach registry.k8s.io directly. DaoCloud mirrors
  # that registry and this digest is byte-for-byte identical to the upstream
  # v0.12.0 manifest, so tag substitution cannot change what is executed.
  image: m.daocloud.io/registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.12.0@sha256:932eae60e2bcf9c4660d6442da066ef1a79b4ea7cc232c61c7303069216ca006
  metricsRelistInterval: 30s
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

monitoring:
  enabled: true
  # The ARMS metric-agent is deliberately not installed because its mandatory
  # ACK base jobs include API server, etcd, kubelet and node metrics. This
  # small collector sends only the allowlisted gateway workload metrics.
  remoteWriteUrl: ""
  clusterId: ""
  collector:
    # Docker Hub is not reliably reachable from the current Beijing vSwitch.
    # This mirrored image is pulled from ACR; replace it with our own ACR copy
    # before production hardening.
    image: registry.cn-hangzhou.aliyuncs.com/marksugar-k8s/prometheus:v2.26.0
    scrapeInterval: 15s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  alerts:
    enabled: true
    minRequests5m: 20
    errorRatioWarning: 0.05
    errorRatioCritical: 0.15
    abortRatioWarning: 0.01
    abortRatioCritical: 0.05
    ttftP90WarningMilliseconds: 1000
    tpotP90WarningMilliseconds: 100
    providerSuccessRatioWarning: 0.99
    gatewayMemoryWarningBytes: 805306368
    ciliumCTPressureWarning: 0.70
    ciliumCTPressureCritical: 0.90
  grafana:
    # Dashboards are packaged as ConfigMaps. Managed Grafana imports the JSON;
    # no Grafana server or sidecar is installed into ACK by this chart.
    dashboardsEnabled: true
  hpaState:
    enabled: true
    # Only HPA objects in the Higress namespace are watched. This is not the
    # full kube-state-metrics deployment used by cs-default.
    image: m.daocloud.io/registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.0@sha256:6b2f0b6f2f86ac5b1aa883a033a8dd55bb96c16d191ec973393bdaadaddac914
    namespace: higress-system
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 96Mi
  # Contracted capacity is a model/provider property, not a measured value.
  # Populate it only from a provider contract or console quota page.
  providerModelCapacity: []
    # - provider: bailian
    #   model: qwen-max
    #   rpmLimit: 600
    #   tpmLimit: 1000000
  discoveryObjectsEnabled: false
  discoveryAnnotation: "true"
  interval: 15s
  gateway:
    namespace: higress-system
    selector:
      app: higress-gateway
    port: istio-prom
    path: /stats/prometheus
  controller:
    namespace: higress-system
    selector:
      app: higress-controller
    port: http-monitoring
    path: /metrics
  terway:
    namespace: kube-system
    selector:
      app: terway-eniip
    targetPort: 9962
    path: /metrics
  loadgen:
    namespace: higress-performance
    selector:
      app: load-generator
    port: bench-prom
    path: /metrics
