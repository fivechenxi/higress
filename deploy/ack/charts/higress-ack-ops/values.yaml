autoscaling:
  gateway:
    minReplicas: 2
    maxReplicas: 4
    activeStreams:
      enabled: true
      averageValue: "225"
  controller:
    minReplicas: 2
    maxReplicas: 3
    cpuUtilization: 65
  scaleDownStabilizationSeconds: 300

prometheusAdapter:
  enabled: true
  # Beijing workers cannot reach registry.k8s.io directly. DaoCloud mirrors
  # that registry and this digest is byte-for-byte identical to the upstream
  # v0.12.0 manifest, so tag substitution cannot change what is executed.
  image: m.daocloud.io/registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.12.0@sha256:932eae60e2bcf9c4660d6442da066ef1a79b4ea7cc232c61c7303069216ca006
  metricsRelistInterval: 30s
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

monitoring:
  enabled: true
  # The ARMS metric-agent remains disabled because its mandatory ACK jobs run
  # every 30 seconds and include kubelet/cAdvisor. This collector uses a small
  # 60-second cluster allowlist instead.
  remoteWriteUrl: ""
  clusterId: ""
  clusterBaseline:
    enabled: true
    scrapeInterval: 60s
    # Added to the existing hpaState namespace and routeNamespace only while
    # the cluster baseline is enabled.
    extraWorkloadNamespaces:
      - kube-system
    nodeExporter:
      enabled: true
      image: m.daocloud.io/docker.io/prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 96Mi
  collector:
    # Docker Hub is not reliably reachable from the current Beijing vSwitch.
    # This mirrored image is pulled from ACR; replace it with our own ACR copy
    # before production hardening.
    image: registry.cn-hangzhou.aliyuncs.com/marksugar-k8s/prometheus:v2.26.0
    scrapeInterval: 15s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  alerts:
    enabled: true
    minRequests5m: 20
    successRatioWarning: 0.99
    errorRatioWarning: 0.02
    errorRatioCritical: 0.15
    abortRatioWarning: 0.01
    abortRatioCritical: 0.05
    ttftP90WarningMilliseconds: 25000
    ttftP90CriticalMilliseconds: 50000
    tpotP90WarningMilliseconds: 50
    tpotP90CriticalMilliseconds: 70
    # Envoy downstream duration includes the full streaming response. This is
    # intentionally a loose first-pass infrastructure threshold, not TTFT.
    gatewayDurationP90WarningMilliseconds: 120000
    hpaNearScaleUpRatio: 0.80
    hpaNearMaxReplicasRatio: 0.80
    customerLimitWarningRatio: 0.90
    gatewayResetWarning5m: 3
    gatewayMemoryWarningBytes: 805306368
    ciliumCTPressureWarning: 0.70
    ciliumCTPressureCritical: 0.90
  alerting:
    enabled: true
    alertmanager:
      image: m.daocloud.io/docker.io/prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
      groupWait: 30s
      groupInterval: 5m
      repeatInterval: 2h
      resources:
        requests:
          cpu: 20m
          memory: 48Mi
        limits:
          cpu: 200m
          memory: 128Mi
    feishu:
      enabled: false
      existingSecret: higress-feishu-alert-webhook
      webhookKey: webhook-url
      relayImage: m.daocloud.io/docker.io/library/python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 96Mi
  grafana:
    enabled: true
    dashboardsEnabled: true
    # Empty keeps the in-cluster collector as the query source. ACK installs
    # set this to the ARMS intranet HTTP API so collector rollouts do not erase
    # the visible dashboard history.
    prometheusUrl: ""
    prometheusAuth:
      existingSecret: ""
      authorizationKey: authorization
    image: m.daocloud.io/docker.io/grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    host: ack.tokenvolt.net
    path: /grafana
    rootUrl: https://ack.tokenvolt.net/grafana/
    ingressClassName: higress
    existingSecret: higress-grafana-admin
    adminUserKey: admin-user
    adminPasswordKey: admin-password
    sls:
      enabled: false
      existingSecret: higress-grafana-sls
      accessKeyIdKey: access-key-id
      accessKeySecretKey: access-key-secret
      endpoint: cn-beijing-intranet.log.aliyuncs.com
      project: ""
      logstore: model-access
      plugin:
        version: "2.39.2"
        commit: a73857e05f2e1f8253534d909f5388553991ce93
        archiveSha256: 8aaf97e81380553db098ef7a641689ffd2dcddb20afe0fdf6d8b2b182920ff8b
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  hpaState:
    enabled: true
    # A deliberately narrow kube-state-metrics instance: HPA/route discovery
    # plus workload availability and restart state in the three namespaces
    # above. It does not expose container resource metrics.
    image: m.daocloud.io/registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.0@sha256:6b2f0b6f2f86ac5b1aa883a033a8dd55bb96c16d191ec973393bdaadaddac914
    namespace: higress-system
    routeNamespace: tokenvolt-system
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 96Mi
  quotaMetrics:
    enabled: false
    image: m.daocloud.io/docker.io/library/python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    higressNamespace: higress-system
    redisHost: tokenvolt-rate-limit-redis.tokenvolt-system.svc.cluster.local
    redisPort: 6379
    existingSecret: ""
    credentialRevision: ""
    usernameKey: username
    passwordKey: password
    resources:
      requests: {cpu: 10m, memory: 24Mi}
      limits: {cpu: 100m, memory: 64Mi}
  # Contracted capacity is a model/provider property, not a measured value.
  # Populate it only from a provider contract or console quota page.
  providerModelCapacity: []
    # - provider: bailian
    #   model: qwen-max
    #   rpmLimit: 600
    #   tpmLimit: 1000000
  discoveryObjectsEnabled: false
  discoveryAnnotation: "true"
  interval: 15s
  gateway:
    namespace: higress-system
    deployment: higress-gateway
    selector:
      app: higress-gateway
    port: istio-prom
    path: /stats/prometheus
  controller:
    namespace: higress-system
    selector:
      app: higress-controller
    port: http-monitoring
    path: /metrics
  terway:
    namespace: kube-system
    selector:
      app: terway-eniip
    targetPort: 9962
    path: /metrics
  loadgen:
    namespace: higress-performance
    selector:
      app: load-generator
    port: bench-prom
    path: /metrics
