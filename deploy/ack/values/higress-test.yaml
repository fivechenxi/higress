global:
  enableGatewayAPI: false
  enableRedis: false
  enablePluginServer: false
  ingressClass: higress
  createIngressClass: true

gateway:
  kind: Deployment
  replicas: 2
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    # Managed by the higress-ack-ops Helm chart so both workloads share one
    # explicit scaling policy and observability contract.
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 65
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: higress-gateway
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      # Four replicas can be placed 2/1/1 on the three-node test pool. Keep
      # the skew hard-bounded so a single node cannot own every gateway Pod.
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: higress-gateway

controller:
  replicas: 2
  automaticHttps:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: higress-controller
          topologyKey: kubernetes.io/hostname

pilot:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
