global:
  enableGatewayAPI: false
  enableRedis: false
  enablePluginServer: false
  ingressClass: higress
  createIngressClass: true

# Enable only after ALB controller, two-zone vSwitches, certificate and both
# 900-second timeout quotas have been verified. CLB remains in place.
albIngress:
  enabled: false
  # Only the model API moves to this Gateway-backed ALB. ack/www stay on CLB.
  host: api.tokenvolt.net
  vSwitchIds: []
  certificateId: ""
  requestTimeout: 900
  idleTimeout: 900
  # Match the existing CLB check of the Gateway Pod agent, not model routes.
  healthPort: 15020
  healthPath: /healthz/ready

meshConfig:
  # Keep the billing fields structured and omit prompt/response bodies. The
  # TokenVolt auth plugin overwrites x-mse-consumer before this value is logged.
  accessLogFormat: '{"ai_log":"%FILTER_STATE(wasm.ai_log:PLAIN)%","consumer":"%REQ(X-MSE-CONSUMER)%","authority":"%REQ(X-ENVOY-ORIGINAL-HOST?:AUTHORITY)%","bytes_received":"%BYTES_RECEIVED%","bytes_sent":"%BYTES_SENT%","duration":"%DURATION%","method":"%REQ(:METHOD)%","path":"%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%","provider":"%REQ(X-TOKENVOLT-PROVIDER)%","protocol":"%PROTOCOL%","request_id":"%REQ(X-REQUEST-ID)%","response_code":"%RESPONSE_CODE%","response_flags":"%RESPONSE_FLAGS%","route_name":"%ROUTE_NAME%","start_time":"%START_TIME%","upstream_cluster":"%UPSTREAM_CLUSTER%","upstream_host":"%UPSTREAM_HOST%","upstream_service_time":"%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%","upstream_transport_failure_reason":"%UPSTREAM_TRANSPORT_FAILURE_REASON%"}'

gateway:
  kind: Deployment
  replicas: 2
  externallyManagedReplicas: true
  # Remove endpoints, drain HTTP requests and flush logs before SIGTERM.
  # pilot-agent then drains connections; Kubernetes enforces the 11 minute bound.
  terminationGracePeriodSeconds: 660
  lifecycle:
    preStop:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            admin=http://127.0.0.1:15000
            curl -fsS --max-time 2 -X POST "$admin/healthcheck/fail"
            sleep 15
            curl -fsS --max-time 2 -X POST "$admin/drain_listeners?graceful&skip_exit"
            deadline=$(( $(date +%s) + 600 ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              stats=$(curl -fsS --max-time 2 "$admin/stats?filter=downstream_rq_active")
              active=$(printf '%s\n' "$stats" | awk '/^http[.]outbound_.*[.]downstream_rq_active:/ {n += $2; found=1} END {if(found) print n; else print "unknown"}')
              echo "tokenvolt drain: active_requests=$active" > /proc/1/fd/1
              if [ "$active" = "0" ]; then
                # Envoy buffers file access logs (1s by default). Do not let
                # exit-on-zero kill it before the last usage log is flushed.
                sleep 2
                exit 0
              fi
              sleep 2
            done
            # Let pilot-agent use the remaining Pod grace if polling failed.

  env:
    EXIT_ON_ZERO_ACTIVE_CONNECTIONS: "true"
    MINIMUM_DRAIN_DURATION: "5s"
    PROXY_CONFIG: '{"terminationDrainDuration":"600s"}'
  minReadySeconds: 10
  rollingMaxSurge: 1
  rollingMaxUnavailable: 0
  service:
    # A single-AZ ACK test cluster cannot satisfy NLB's two-zone vSwitch
    # requirement. Let ACK CCM create a low-cost Internet-facing CLB for the
    # public canary entrypoint; switch to NLB when the multi-AZ topology lands.
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/alibaba-cloud-loadbalancer-address-type: internet
      service.beta.kubernetes.io/alibaba-cloud-loadbalancer-additional-resource-tags: Project=higress,Environment=production,ManagedBy=ack-ccm
    externalTrafficPolicy: Cluster
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    # Managed by the higress-ack-ops Helm chart so both workloads share one
    # explicit scaling policy and observability contract.
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 65
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: higress-gateway
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      # Four replicas can be placed 2/1/1 on the three-node test pool. Keep
      # the skew hard-bounded so a single node cannot own every gateway Pod.
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: higress-gateway

controller:
  replicas: 2
  automaticHttps:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: higress-controller
          topologyKey: kubernetes.io/hostname

pilot:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
